<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>for him</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
<div class="page">
 
  <header class="banner">
    <img class="orn-img" src="ornament.jpg" alt="">
    <h1>for HIS NAME</h1>
    <nav class="topnav">
      <a href="#letter">letter</a>
      <a href="#updates">updates</a>
    </nav>
  </header>
 
  <div class="cols">
 
    <section class="main">
      <header class="pill">welcome</header>
 
      <article id="letter">
        <header><h2>a letter</h2></header>
        <p>Write one or two sentences to him here.</p>
        <div class="row">
          <p>Write a few more words here, or leave this part short.</p>
          <aside>
            <div class="stamp"><img src="anime.gif" alt="Two anime characters about to kiss"></div>
          </aside>
        </div>
        <footer>always yours, YOUR NAME</footer>
      </article>
 
      <article id="updates">
        <header><h2>updates</h2></header>
        <p><i>oct 23, 2026</i> - the site is open!</p>
        <p><i>add a date</i> - write your next update here.</p>
      </article>
    </section>
 
    <section class="side">
      <header class="pill">navigate</header>
      <nav class="sidenav">
        <a href="#top">home</a>
        <a href="#letter">letter</a>
        <a href="#updates">updates</a>
      </nav>
    </section>
 
  </div>
 
  <footer class="pagefoot">made with love</footer>
 
</div>
</body>
</html>
