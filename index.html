<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>i love you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
<div class="page">
 
  <header class="banner">
    <img class="orn-img" src="ornament.jpg" alt="">
    <h1>for nick</h1>
  </header>
 
  <div class="cols">
 
    <!-- LEFT SIDEBAR -->
    <aside class="left">
      <div class="pill">introduction</div>
      <div class="bubble">
        <p>hi! <b></b>. hello .</p>
      </div>
 
      <div class="pill">stuff</div>
      <div class="bubble nav">
        <a href="#top">home</a>
        <a href="#drawings">drawings</a>
        <a href="#collection">collection</a>
        <a href="#updates">updates</a>
      </div>
    </aside>
 
    <!-- CENTER -->
    <main>
      <div class="bubble hero">
        <h2>hi my love</h2>
        <p>poop.</p>
      </div>
 
      <section id="drawings">
        <div class="pill">drawings</div>
        <div class="bubble">
          <div class="gallery">
            <!-- To add a drawing: upload the image to your repo, then replace
                 <div class="empty">...</div> in a frame with:
                 <img src="mydrawing.jpg" alt="describe the drawing"> -->
            <figure>
              <div class="bezel"><div class="empty"><span></span></div></div>
              <figcaption></figcaption>
            </figure>
            <figure>
              <div class="bezel"><div class="empty"><span></span></div></div>
              <figcaption></figcaption>
            </figure>
            <figure>
              <div class="bezel"><div class="empty"><span></span></div></div>
              <figcaption></figcaption>
            </figure>
            <figure>
              <div class="bezel"><div class="empty"><span></span></div></div>
              <figcaption></figcaption>
            </figure>
          </div>
        </div>
      </section>
 
      <section id="collection">
        <div class="pill">collection</div>
        <div class="bubble">
          <div class="thumbs">
            <figure>
              <div class="bezel"><img src="cassettes.jpg" alt=></div>
              <figcaption class="label"></figcaption>
            </figure>
            <figure>
              <div class="bezel"><img src="antlers.jpg" alt=></div>
              <figcaption class="label"></figcaption>
            </figure>
            <figure>
              <div class="bezel"><img src="swords.jpg" alt=></div>
              <figcaption class="label"></figcaption>
            </figure>
          </div>
        </div>
      </section>
 
      <section id="updates">
        <div class="pill">updates</div>
        <div class="bubble">
          <p><i>oct 23, 2026</i> - yay!</p>
        </div>
        <div class="bubble">
          <p><i></i> ._.</p>
        </div>
      </section>
    </main>
 
    <!-- RIGHT SIDEBAR -->
    <aside class="right">
      <div class="pill">now playing</div>
      <div class="bubble">
        <p><b>song name</b></p>
        <p>artist name</p>
      </div>
 
      <div class="pill">favorites</div>
      <div class="bubble stamps">
        <div class="stamp"><img src="anime.gif" alt=></div>
        <div class="stamp"><img src="robots.gif" alt=></div>
      </div>
    </aside>
 
  </div>
 
  <footer><i>i love you</i></footer>
 
</div>

</html>
